<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>e-Reservasi</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: "Segoe UI", Arial, sans-serif;
  background: #071a17;
}

#app {
  width: 100%;
  height: 100vh;
  border: 0;
  display: block;
}


/* =========================
   LOADER
========================= */

#loader {
  position: fixed;
  inset: 0;
  z-index: 9999;

  display: flex;
  align-items: center;
  justify-content: center;

  background:
    radial-gradient(
      circle at center,
      #0d2a24 0%,
      #071a17 55%,
      #04110f 100%
    );

  transition:
    opacity .6s ease,
    visibility .6s ease;
}

#loader.hide {
  opacity: 0;
  visibility: hidden;
}


/* =========================
   CONTENT
========================= */

.box {
  width: min(420px, 88%);
  text-align: center;
}


/* =========================
   ICON
========================= */

.icon {
  position: relative;

  width: 82px;
  height: 82px;

  margin: 0 auto 28px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 22px;

  background: rgba(16,185,129,.08);

  border: 1px solid rgba(110,231,183,.18);

  animation: float 2.5s ease-in-out infinite;
}


/* calendar */

.calendar {
  position: relative;

  width: 38px;
  height: 42px;

  border: 2px solid #6ee7b7;

  border-radius: 7px;
}

.calendar::before {
  content: "";

  position: absolute;

  left: -2px;
  right: -2px;
  top: 9px;

  height: 2px;

  background: #6ee7b7;
}

.calendar::after {
  content: "";

  position: absolute;

  width: 5px;
  height: 5px;

  border-radius: 50%;

  background: #34d399;

  left: 8px;
  top: 18px;

  box-shadow:
    10px 0 #34d399,
    0 9px #34d399,
    10px 9px #34d399;
}

.calendar span {
  position: absolute;

  width: 5px;
  height: 9px;

  top: -7px;

  border-radius: 3px;

  background: #6ee7b7;
}

.calendar span:first-child {
  left: 7px;
}

.calendar span:last-child {
  right: 7px;
}


/* =========================
   TEXT
========================= */

.label {
  color: #6ee7b7;

  font-size: 11px;

  font-weight: 700;

  letter-spacing: 3px;

  text-transform: uppercase;

  margin-bottom: 12px;
}

h1 {
  margin: 0;

  color: #ffffff;

  font-size: clamp(25px, 6vw, 32px);

  line-height: 1.25;

  font-weight: 700;

  letter-spacing: -.5px;
}

.subtitle {
  margin-top: 10px;

  color: #b7c9c5;

  font-size: 14px;

  line-height: 1.5;
}


/* =========================
   LOADING
========================= */

.loading {
  width: 180px;

  margin: 32px auto 0;
}

.progress {
  width: 100%;
  height: 3px;

  overflow: hidden;

  border-radius: 10px;

  background: rgba(255,255,255,.10);
}

.progress-bar {
  width: 0%;
  height: 100%;

  background: #34d399;

  border-radius: inherit;

  transition: width .2s ease;
}

.loading-text {
  margin-top: 10px;

  color: #718681;

  font-size: 10px;

  letter-spacing: .5px;
}


/* =========================
   ANIMATION
========================= */

@keyframes float {

  0%,
  100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-6px);
  }
}


/* =========================
   MOBILE
========================= */

@media (max-width: 480px) {

  .icon {
    width: 72px;
    height: 72px;

    margin-bottom: 23px;
  }

  h1 {
    font-size: 25px;
  }

  .subtitle {
    font-size: 13px;
  }

  .loading {
    margin-top: 27px;
  }
}
</style>
</head>

<body>


<!-- =========================
     GOOGLE APPS SCRIPT
========================= -->

<iframe
  id="app"
  src="https://script.google.com/macros/s/AKfycbxblWUXav5MLhn1nS3qoxprQwhExvkxfnQIROZGltByI8pr4FXTh1EtmB0UDAKLW4yy/exec"
  loading="eager">
</iframe>


<!-- =========================
     LOADING SCREEN
========================= -->

<div id="loader">

  <div class="box">

    <!-- ICON -->

    <div class="icon">

      <div class="calendar">

        <span></span>
        <span></span>

      </div>

    </div>


    <!-- TITLE -->

    <div class="label">
      e-Reservasi
    </div>

    <h1>
      Workshop Transformasi Digital
    </h1>

    <div class="subtitle">
      Puskesmas Kabupaten Kulon Progo
    </div>


    <!-- LOADING -->

    <div class="loading">

      <div class="progress">

        <div
          class="progress-bar"
          id="progressBar">
        </div>

      </div>

      <div class="loading-text">
        Memuat aplikasi
      </div>

    </div>

  </div>

</div>


<script>

const loader =
  document.getElementById("loader");

const iframe =
  document.getElementById("app");

const progressBar =
  document.getElementById("progressBar");

let progress = 0;
let loaded = false;


/* =========================
   ANIMASI LOADING
========================= */

const timer = setInterval(() => {

  if (progress < 90) {

    progress += 2;

    progressBar.style.width =
      progress + "%";

  }

}, 100);


/* =========================
   BUKA APP
========================= */

function openApp() {

  if (loaded) return;

  loaded = true;

  clearInterval(timer);

  progressBar.style.width = "100%";

  setTimeout(() => {

    loader.classList.add("hide");

  }, 500);
}


/* =========================
   SAAT APP SELESAI LOAD
========================= */

iframe.addEventListener(
  "load",
  () => {

    setTimeout(() => {

      openApp();

    }, 700);

  }
);


/* =========================
   FALLBACK
   Jika iframe lambat
========================= */

setTimeout(() => {

  openApp();

}, 7000);

</script>

</body>
</html>
