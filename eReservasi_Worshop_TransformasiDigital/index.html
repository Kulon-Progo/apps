<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>e-Reservasi | Workshop Transformasi Digital Puskesmas</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family:
    "Segoe UI",
    Inter,
    Arial,
    sans-serif;
  background: #f5f7f8;
}

#app {
  width: 100%;
  height: 100vh;
  border: 0;
  display: block;
}


/* =========================================
   LOADER
========================================= */

#loader {
  position: fixed;
  inset: 0;
  z-index: 9999;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #f5f7f8;

  transition:
    opacity .5s ease,
    visibility .5s ease;
}

#loader.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}


/* =========================================
   CARD
========================================= */

.loader-card {
  width: min(520px, 90%);

  padding: 48px 42px 38px;

  text-align: center;

  background: #ffffff;

  border: 1px solid #e5e7eb;

  border-radius: 20px;

  box-shadow:
    0 20px 60px rgba(15, 23, 42, .08);
}


/* =========================================
   SIMPLE ICON
========================================= */

.icon-wrap {
  width: 72px;
  height: 72px;

  margin: 0 auto 28px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 18px;

  background: #ecfdf5;

  border: 1px solid #d1fae5;
}


/* Calendar */

.calendar {
  position: relative;

  width: 34px;
  height: 38px;

  border: 2px solid #059669;

  border-radius: 6px;
}

.calendar::before {
  content: "";

  position: absolute;

  left: -2px;
  right: -2px;
  top: 7px;

  height: 2px;

  background: #059669;
}

.calendar::after {
  content: "";

  position: absolute;

  width: 5px;
  height: 5px;

  border-radius: 50%;

  background: #059669;

  top: 16px;
  left: 8px;

  box-shadow:
    10px 0 0 #059669,
    0 9px 0 #059669,
    10px 9px 0 #059669;
}

.calendar-pin {
  position: absolute;

  width: 5px;
  height: 9px;

  border-radius: 3px;

  background: #059669;

  top: -6px;
  left: 7px;

  box-shadow:
    14px 0 0 #059669;
}


/* =========================================
   LABEL
========================================= */

.label {
  display: inline-block;

  margin-bottom: 16px;

  color: #047857;

  font-size: 11px;

  font-weight: 700;

  letter-spacing: 2px;

  text-transform: uppercase;
}


/* =========================================
   TITLE
========================================= */

h1 {
  margin: 0;

  color: #172033;

  font-size:
    clamp(23px, 5vw, 30px);

  line-height: 1.3;

  font-weight: 700;

  letter-spacing: -.5px;
}


/* =========================================
   SUBTITLE
========================================= */

.subtitle {
  margin-top: 9px;

  color: #475569;

  font-size: 15px;

  font-weight: 500;
}


/* =========================================
   TAGLINE
========================================= */

.tagline {
  max-width: 400px;

  margin: 18px auto 30px;

  color: #64748b;

  font-size: 13px;

  line-height: 1.7;

  font-style: italic;
}


/* =========================================
   DIVIDER
========================================= */

.divider {
  width: 45px;
  height: 2px;

  margin: 0 auto 25px;

  background: #10b981;

  border-radius: 10px;
}


/* =========================================
   LOADING
========================================= */

.loading {
  margin-top: 8px;
}

.loading-info {
  display: flex;

  justify-content: space-between;

  margin-bottom: 8px;

  color: #94a3b8;

  font-size: 11px;
}

.progress {
  width: 100%;
  height: 4px;

  overflow: hidden;

  background: #e5e7eb;

  border-radius: 20px;
}

.progress-bar {
  width: 0%;
  height: 100%;

  background: #059669;

  border-radius: inherit;

  transition: width .25s ease;
}

.status {
  min-height: 18px;

  margin-top: 12px;

  color: #64748b;

  font-size: 11px;
}


/* =========================================
   FOOTER
========================================= */

.footer {
  margin-top: 28px;

  padding-top: 18px;

  border-top: 1px solid #f1f5f9;

  color: #94a3b8;

  font-size: 10px;

  line-height: 1.6;
}

.footer strong {
  color: #64748b;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 480px) {

  .loader-card {
    width: 90%;

    padding:
      38px
      24px
      30px;

    border-radius: 18px;
  }

  .icon-wrap {
    width: 64px;
    height: 64px;

    margin-bottom: 23px;
  }

  h1 {
    font-size: 22px;
  }

  .subtitle {
    font-size: 14px;
  }

  .tagline {
    font-size: 12px;
  }
}
</style>
</head>


<body>


<!-- =========================================
     GOOGLE APPS SCRIPT
========================================= -->

<iframe
  id="app"
  src="https://script.google.com/macros/s/AKfycbxblWUXav5MLhn1nS3qoxprQwhExvkxfnQIROZGltByI8pr4FXTh1EtmB0UDAKLW4yy/exec"
  loading="eager">
</iframe>


<!-- =========================================
     LOADING SCREEN
========================================= -->

<div id="loader">

  <div class="loader-card">

    <!-- ICON -->
    <div class="icon-wrap">

      <div class="calendar">

        <div class="calendar-pin"></div>

      </div>

    </div>


    <!-- LABEL -->
    <div class="label">
      e-Reservasi
    </div>


    <!-- TITLE -->
    <h1>
      Workshop Transformasi Digital<br>
      Puskesmas
    </h1>


    <!-- SUBTITLE -->
    <div class="subtitle">
      Kabupaten Kulon Progo
    </div>


    <!-- TAGLINE -->
    <div class="tagline">
      “Sesarengan Mbangun Ekosistem Digital
      Kesehatan Kulon Progo”
    </div>


    <!-- DIVIDER -->
    <div class="divider"></div>


    <!-- LOADING -->
    <div class="loading">

      <div class="loading-info">

        <span id="loadingText">
          Menyiapkan reservasi
        </span>

        <span id="percent">
          0%
        </span>

      </div>


      <div class="progress">

        <div
          class="progress-bar"
          id="progressBar">
        </div>

      </div>


      <div
        class="status"
        id="status">

        Memuat sistem e-Reservasi...

      </div>

    </div>


    <!-- FOOTER -->
    <div class="footer">

      <strong>
        Dinas Kesehatan Kabupaten Kulon Progo
      </strong>

      <br>

      Ekosistem Digital Kesehatan Kulon Progo

    </div>

  </div>

</div>


<script>

const loader =
  document.getElementById("loader");

const iframe =
  document.getElementById("app");

const progressBar =
  document.getElementById("progressBar");

const percent =
  document.getElementById("percent");

const loadingText =
  document.getElementById("loadingText");

const status =
  document.getElementById("status");

let progress = 0;

let finished = false;


/* =========================================
   PROGRESS
========================================= */

const timer = setInterval(() => {

  if (progress < 92) {

    progress +=
      Math.floor(Math.random() * 3) + 1;

    if (progress > 92) {
      progress = 92;
    }

    progressBar.style.width =
      progress + "%";

    percent.textContent =
      progress + "%";


    if (progress < 30) {

      loadingText.textContent =
        "Menyiapkan reservasi";

      status.textContent =
        "Memuat sistem e-Reservasi...";

    }

    else if (progress < 60) {

      loadingText.textContent =
        "Memuat informasi";

      status.textContent =
        "Menyiapkan formulir reservasi...";

    }

    else if (progress < 85) {

      loadingText.textContent =
        "Menyiapkan aplikasi";

      status.textContent =
        "Memuat halaman kegiatan...";

    }

    else {

      loadingText.textContent =
        "Hampir selesai";

      status.textContent =
        "Membuka e-Reservasi...";

    }

  }

}, 250);


/* =========================================
   HIDE LOADER
========================================= */

function hideLoader() {

  if (finished) return;

  finished = true;

  clearInterval(timer);

  progressBar.style.width = "100%";

  percent.textContent = "100%";

  loadingText.textContent =
    "Selesai";

  status.textContent =
    "e-Reservasi siap digunakan.";

  setTimeout(() => {

    loader.classList.add("hide");

  }, 500);
}


/* =========================================
   IFRAME LOADED
========================================= */

iframe.addEventListener(
  "load",
  () => {

    setTimeout(() => {

      hideLoader();

    }, 600);

  }
);


/* =========================================
   FALLBACK
========================================= */

setTimeout(() => {

  hideLoader();

}, 8000);

</script>

</body>
</html>
