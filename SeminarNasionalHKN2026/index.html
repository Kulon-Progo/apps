
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f8ff">
  <title>Seminar Nasional HKN 2026</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f5f8ff;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
      opacity: 0;
      transition: opacity .55s ease;
    }

    #app.show {
      opacity: 1;
    }

    #loader {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(
          circle at 12% 12%,
          rgba(50, 103, 220, .11),
          transparent 35%
        ),
        radial-gradient(
          circle at 88% 85%,
          rgba(222, 67, 78, .08),
          transparent 32%
        ),
        #f7f9fe;
      transition: opacity .6s ease, visibility .6s ease;
    }

    #loader.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .content {
      width: min(100%, 390px);
      text-align: center;
      color: #183153;
      animation: appear .75s ease both;
    }

    /* IKON HATI DAN KOMUNIKASI */
    .visual {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 0 auto 28px;
      display: grid;
      place-items: center;
    }

    .orbit {
      position: absolute;
      inset: 0;
      border: 1px solid #dbe5f5;
      border-radius: 32px;
      animation: breathe 3s ease-in-out infinite;
    }

    .orbit::after {
      content: "";
      position: absolute;
      top: 13px;
      right: 13px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #dc4955;
      box-shadow: 0 0 0 5px #f9e8ea;
    }

    .symbol {
      width: 76px;
      height: 76px;
      display: grid;
      place-items: center;
      color: white;
      border-radius: 24px;
      background: linear-gradient(145deg, #4277e8, #2452b5);
      box-shadow: 0 12px 28px rgba(43, 87, 174, .2);
      animation: float 3s ease-in-out infinite;
    }

    .symbol svg {
      width: 43px;
      height: 43px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.65;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .heart {
      position: absolute;
      right: -5px;
      bottom: 8px;
      width: 31px;
      height: 31px;
      display: grid;
      place-items: center;
      border: 3px solid #f7f9fe;
      border-radius: 50%;
      color: #d8404e;
      background: #fbe8e9;
      animation: heartBeat 2s ease-in-out infinite;
    }

    .heart svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
      stroke: currentColor;
      stroke-width: 1.4;
    }

    .eyebrow {
      margin-bottom: 10px;
      color: #426ac3;
      font-size: 10px;
      font-weight: 750;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      margin-bottom: 12px;
      font-size: clamp(25px, 5vw, 31px);
      line-height: 1.2;
      letter-spacing: -.7px;
      font-weight: 750;
    }

    .theme {
      color: #d04450;
      font-size: 15px;
      font-weight: 650;
      line-height: 1.5;
    }

    .subtitle {
      margin-top: 8px;
      color: #7a879d;
      font-size: 12px;
      line-height: 1.7;
    }

    /* LOADING */
    .loading {
      width: 220px;
      max-width: 100%;
      margin: 30px auto 0;
    }

    .track {
      height: 3px;
      overflow: hidden;
      border-radius: 10px;
      background: #e0e7f2;
    }

    #bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #386bd3, #d94a55);
      transition: width .25s ease;
    }

    #status {
      margin-top: 12px;
      color: #8490a5;
      font-size: 11px;
      letter-spacing: .3px;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @keyframes breathe {
      0%, 100% {
        transform: scale(1);
        opacity: .75;
      }
      50% {
        transform: scale(1.055);
        opacity: 1;
      }
    }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      12% { transform: scale(1.12); }
      24% { transform: scale(1); }
      36% { transform: scale(1.08); }
      48% { transform: scale(1); }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <div id="loader">
    <main class="content">

      <div class="visual">
        <div class="orbit"></div>

        <div class="symbol">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 21s-8-4.8-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6.2-8 11-8 11Z"/>
            <path d="M3.5 12h5l2-3 3 6 2-3h5"/>
          </svg>
        </div>

        <div class="heart">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/>
          </svg>
        </div>
      </div>

      <div class="eyebrow">Hari Kesehatan Nasional · 2026</div>

      <h1>Seminar Nasional HKN</h1>

      <div class="theme">
        “Communicating with Heart &amp; Mind”
      </div>

      <p class="subtitle">
        Kabupaten Kulon Progo
      </p>

      <div class="loading">
        <div class="track">
          <div id="bar"></div>
        </div>
        <div id="status">Menyiapkan aplikasi...</div>
      </div>

    </main>
  </div>

  <iframe
    id="app"
    title="Seminar Nasional HKN Kulon Progo 2026"
    src="https://script.google.com/macros/s/AKfycbzMLqMnBOQkiBGLe1D3H-dxWJC-KOnXNVrQysjslACg9waL9haPhnhM55q3RHQHE_Vwgw/exec"
    allow="camera; microphone; geolocation"
    loading="eager">
  </iframe>

  <script>
    const app = document.getElementById("app");
    const loader = document.getElementById("loader");
    const bar = document.getElementById("bar");
    const status = document.getElementById("status");

    let progress = 0;
    let completed = false;

    const timer = setInterval(() => {
      if (completed) {
        clearInterval(timer);
        return;
      }

      progress = Math.min(progress + Math.random() * 5, 90);
      bar.style.width = progress + "%";
    }, 180);

    function finishLoading() {
      if (completed) return;

      completed = true;
      clearInterval(timer);

      bar.style.width = "100%";
      status.textContent = "Membuka seminar...";

      setTimeout(() => {
        app.classList.add("show");
        loader.classList.add("hide");
      }, 400);
    }

    app.addEventListener("load", finishLoading);

    // Pengaman jika iframe membutuhkan waktu lama
    setTimeout(() => {
      if (!completed) finishLoading();
    }, 10000);
  </script>

</body>
</html>
