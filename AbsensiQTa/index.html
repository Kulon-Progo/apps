<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2e1065">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Absensi Q-Ta">
<title>Absensi Q-Ta | Toko Hijab</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
width:100%;height:100%;overflow:hidden;
font-family:'Segoe UI',system-ui,sans-serif;
background:#090414;
}

iframe{
position:fixed;inset:0;
width:100%;height:100%;
border:0;background:#fff;
}

/* LOADER */
#loader{
position:fixed;inset:0;z-index:9999;
display:flex;align-items:center;justify-content:center;
background:radial-gradient(circle at center,
#581c87 0%,#2e1065 40%,#090414 85%);
transition:opacity .7s ease,visibility .7s ease;
}

.hide{opacity:0;visibility:hidden}

/* AMBIENT */
#loader::before{
content:"";position:absolute;
width:320px;height:320px;border-radius:50%;
background:rgba(217,70,239,.18);
filter:blur(80px);
animation:ambient 5s infinite ease-in-out;
}

@keyframes ambient{
0%,100%{transform:scale(.9);opacity:.5}
50%{transform:scale(1.15);opacity:1}
}

/* CARD */
.card{
position:relative;z-index:2;
width:92%;max-width:400px;
padding:30px 25px;border-radius:30px;
background:rgba(24,16,40,.88);
backdrop-filter:blur(25px);
-webkit-backdrop-filter:blur(25px);
border:1px solid rgba(232,121,249,.28);
color:#fff;text-align:center;
box-shadow:0 25px 70px rgba(0,0,0,.7);
}

/* HEADER */
.header{
display:flex;align-items:center;
justify-content:space-between;margin-bottom:8px;
}

.label{
font-size:11px;font-weight:800;
letter-spacing:2px;color:#f5d0fe;
}

.status{
width:10px;height:10px;border-radius:50%;
background:#e879f9;box-shadow:0 0 15px #e879f9;
animation:statusPulse 1.8s infinite;
}

@keyframes statusPulse{
0%,100%{transform:scale(1);opacity:1}
50%{transform:scale(1.6);opacity:.45}
}

/* TITLE */
.title{
font-size:25px;font-weight:800;
letter-spacing:1px;color:#fff;margin-top:7px;
}

.subtitle{
font-size:13px;font-weight:500;
color:#f5d0fe;margin-top:7px;line-height:1.65;
}

/* ANIMATION */
.mind{
position:relative;height:165px;
margin:20px 0 15px;
}

/* ORBIT */
.orbit{
position:absolute;left:50%;top:50%;
width:130px;height:130px;
transform:translate(-50%,-50%);
border:1px solid rgba(232,121,249,.35);
border-radius:50%;
animation:rotate 8s linear infinite;
}

.orbit::before,.orbit::after{
content:"";position:absolute;border-radius:50%;
background:#f0abfc;box-shadow:0 0 15px #e879f9;
}

.orbit::before{
width:8px;height:8px;top:12px;left:28px;
}

.orbit::after{
width:6px;height:6px;bottom:20px;right:18px;
}

@keyframes rotate{
from{transform:translate(-50%,-50%) rotate(0deg)}
to{transform:translate(-50%,-50%) rotate(360deg)}
}

/* CORE */
.mind-core{
position:absolute;left:50%;top:50%;
transform:translate(-50%,-50%);
width:82px;height:82px;border-radius:50%;
background:radial-gradient(circle at 35% 30%,
#fce7f3,#e879f9 55%,#a21caf);
display:flex;align-items:center;justify-content:center;
font-size:40px;
box-shadow:0 0 35px rgba(232,121,249,.65);
animation:corePulse 2.5s infinite ease-in-out;
}

@keyframes corePulse{
0%,100%{transform:translate(-50%,-50%) scale(1)}
50%{transform:translate(-50%,-50%) scale(1.08)}
}

/* RIPPLE */
.ring{
position:absolute;left:50%;top:50%;
border:2px solid rgba(232,121,249,.35);
border-radius:50%;transform:translate(-50%,-50%);
animation:ripple 2.8s infinite;
}

.ring:nth-child(1){width:95px;height:95px}
.ring:nth-child(2){width:125px;height:125px;animation-delay:.7s}
.ring:nth-child(3){width:155px;height:155px;animation-delay:1.4s}

@keyframes ripple{
0%{opacity:.7;transform:translate(-50%,-50%) scale(.75)}
100%{opacity:0;transform:translate(-50%,-50%) scale(1.15)}
}

/* WAVE */
.wave{
position:absolute;left:50%;bottom:3px;
transform:translateX(-50%);
width:180px;height:25px;
display:flex;align-items:center;justify-content:center;gap:5px;
}

.wave span{
width:4px;border-radius:10px;
background:linear-gradient(to bottom,#f5d0fe,#c026d3);
animation:wave 1.2s infinite ease-in-out;
}

.wave span:nth-child(1){height:10px;animation-delay:.1s}
.wave span:nth-child(2){height:18px;animation-delay:.2s}
.wave span:nth-child(3){height:25px;animation-delay:.3s}
.wave span:nth-child(4){height:15px;animation-delay:.4s}
.wave span:nth-child(5){height:30px;animation-delay:.5s}
.wave span:nth-child(6){height:15px;animation-delay:.6s}
.wave span:nth-child(7){height:24px;animation-delay:.7s}
.wave span:nth-child(8){height:12px;animation-delay:.8s}

@keyframes wave{
0%,100%{transform:scaleY(.6);opacity:.6}
50%{transform:scaleY(1);opacity:1}
}

/* TEXT */
.loading-text{
font-size:14px;font-weight:700;color:#fff;margin-top:8px;
}

.description{
font-size:12px;line-height:1.7;
color:#f5d0fe;margin-top:7px;
}

/* PROGRESS */
.progress{
margin-top:20px;height:6px;border-radius:20px;
background:#111827;overflow:hidden;
border:1px solid rgba(232,121,249,.15);
}

.bar{
height:100%;width:38%;border-radius:20px;
background:linear-gradient(90deg,#c026d3,#f5d0fe,#c026d3);
animation:loading 1.5s infinite;
}

@keyframes loading{
0%{transform:translateX(-130%)}
100%{transform:translateX(330%)}
}

/* LINK CADANGAN */
#direct{display:none;margin-top:16px;color:#f5d0fe;font-size:12px;font-weight:700;text-decoration:underline}

/* MOBILE */
@media(max-width:480px){
.card{padding:27px 20px}
.title{font-size:22px}
.mind{height:155px}
}

@media(prefers-reduced-motion:reduce){
*,*::before,*::after{animation-duration:3s!important}
}
</style>
</head>

<body>

<!-- WEB APP
     allow="geolocation; camera" WAJIB ada agar GPS & kamera selfie bisa dipakai di dalam iframe (sama seperti SIGAP) -->
<iframe
id="app"
src="https://script.google.com/macros/s/AKfycbzqDn-GP4gzQmXThun2ZoaY0FAxDz8u7tb8EBTeLquRod2hUtmfyoqo0PbBmb4sRKVTpQ/exec"
allow="geolocation *;camera *;microphone *"
loading="eager">
</iframe>

<!-- LOADER -->
<div id="loader">
<div class="card">

<div class="header">
<div class="label">STAFF ATTENDANCE</div>
<div class="status"></div>
</div>

<div class="title">ABSENSI Q-Ta</div>

<div class="subtitle">
Toko Hijab Q-Ta<br>
Disiplin • Profesional • Berkelas
</div>

<div class="mind">
<div class="orbit"></div>

<div class="ring"></div>
<div class="ring"></div>
<div class="ring"></div>

<div class="mind-core">🧕</div>

<div class="wave">
<span></span><span></span><span></span><span></span>
<span></span><span></span><span></span><span></span>
</div>
</div>

<div class="loading-text">Menyiapkan absensi...</div>

<div class="description">
Membangun semangat kerja dan<br>
pelayanan terbaik setiap hari
</div>

<div class="progress">
<div class="bar"></div>
</div>

<a id="direct" target="_top" rel="noopener">Lambat? Buka aplikasi langsung</a>

</div>
</div>

<script>
const loader=document.getElementById("loader");
const app=document.getElementById("app");

function hideLoader(){
loader.classList.add("hide");
}

app.onload=function(){
setTimeout(hideLoader,500);
};

// sinyal "siap" dari aplikasi Absensi (Index.html) → splash ditutup tepat waktu
window.addEventListener("message",function(e){
if(e.data && e.data.app==="presensi" && e.data.ready) hideLoader();
});

// tautan cadangan bila koneksi lambat / iframe diblokir
var direct=document.getElementById("direct");
direct.href=app.src;
setTimeout(function(){ direct.style.display="inline-block"; },5000);

setTimeout(hideLoader,10000);
</script>

</body>
</html>
