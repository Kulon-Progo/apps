<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pendaftaran Online · UPT Puskesmas Panjatan I</title>
<meta name="description" content="Daftar berobat online UPT Puskesmas Panjatan I langsung dari HP.">
<meta name="theme-color" content="#075765">

<!-- Kartu pratinjau saat tautan dibagikan di WhatsApp / media sosial -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="UPT Puskesmas Panjatan I">
<meta property="og:title" content="Daftar Online · Puskesmas Panjatan I">
<meta property="og:description" content="Daftar berobat langsung dari HP. Siapkan No. BPJS / NIK / No. RM dan tanggal lahir pasien.">
<meta property="og:url" content="https://kulon-progo.github.io/apps/Pendaftaran_Online/">
<meta property="og:image" content="https://kulon-progo.github.io/apps/Pendaftaran_Online/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">

<!-- Ikon & pasang ke layar utama -->
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daftar Online">

<style>
:root {
  --primary: #087f8c;
  --secondary: #19c6bd;
  --accent: #8ce8d9;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  background: #f4fbfc;
}

/* Bingkai selalu setinggi layar yang terlihat (ikut naik-turun address bar HP),
   jadi formulir tidak terpotong / menyisakan ruang kosong saat digeser */
#bingkai {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 100vh;
  height: 100dvh;
  height: var(--tinggi, 100dvh);
  overflow: auto;
  -webkit-overflow-scrolling: touch;
}

#app {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}

#loader {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background:
    radial-gradient(circle at 20% 20%, rgba(25,198,189,.28), transparent 35%),
    radial-gradient(circle at 80% 80%, rgba(8,127,140,.35), transparent 35%),
    linear-gradient(135deg, #041e2b, #075765 55%, #062c3b);
  transition: opacity .7s ease, visibility .7s ease;
}

#loader.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.glow {
  position: absolute;
  width: 340px;
  height: 340px;
  border-radius: 50%;
  background: var(--secondary);
  filter: blur(110px);
  opacity: .17;
  animation: glowMove 6s ease-in-out infinite alternate;
}

.card {
  position: relative;
  width: min(90%, 390px);
  padding: 38px 28px 32px;
  border: 1px solid rgba(255,255,255,.17);
  border-radius: 28px;
  background: rgba(255,255,255,.09);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: 0 25px 70px rgba(0,0,0,.3);
  text-align: center;
  color: white;
  animation: cardIn .9s ease both;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 8px 14px;
  border-radius: 30px;
  background: rgba(255,255,255,.1);
  color: #b9f5ec;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  margin-bottom: 23px;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #63f5c9;
  box-shadow: 0 0 12px #63f5c9;
  animation: blink 1.2s infinite;
}

.visual {
  position: relative;
  width: 150px;
  height: 150px;
  margin: 0 auto 25px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Logo Daftar Online di tengah orbit */
.core {
  width: 94px;
  height: 94px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 26px;
  overflow: hidden;
  box-shadow: 0 0 35px rgba(25,198,189,.45);
  animation: pulse 2s ease-in-out infinite;
  z-index: 2;
}

.core img {
  width: 100%;
  height: 100%;
  display: block;
}

.orbit {
  position: absolute;
  inset: 5px;
  border: 1px solid rgba(140,232,217,.4);
  border-radius: 50%;
  animation: rotate 8s linear infinite;
}

.orbit::before,
.orbit::after {
  content: "";
  position: absolute;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #8ce8d9;
  box-shadow: 0 0 15px #8ce8d9;
}

.orbit::before {
  top: 17px;
  left: 20px;
}

.orbit::after {
  bottom: 15px;
  right: 17px;
  width: 7px;
  height: 7px;
}

.ring {
  position: absolute;
  inset: 0;
  border: 1px solid rgba(140,232,217,.2);
  border-radius: 50%;
  animation: ripple 3s ease-out infinite;
}

.ring:nth-child(2) { animation-delay: 1s; }
.ring:nth-child(3) { animation-delay: 2s; }

h1 {
  font-size: 27px;
  font-weight: 800;
  letter-spacing: 2px;
  margin-bottom: 9px;
}

.subtitle {
  color: #b8e8e5;
  font-size: 12px;
  line-height: 1.7;
  letter-spacing: .5px;
}

.subtitle b {
  color: #fff;
  letter-spacing: 1.5px;
}

.wave {
  height: 28px;
  margin: 24px auto 19px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 5px;
}

.wave span {
  width: 4px;
  height: 9px;
  border-radius: 5px;
  background: #63e6d2;
  animation: wave 1s ease-in-out infinite;
}

.wave span:nth-child(2n) { animation-delay: .15s; }
.wave span:nth-child(3n) { animation-delay: .3s; }
.wave span:nth-child(4n) { animation-delay: .45s; }

.loading-text {
  font-size: 11px;
  color: #d2f5f0;
  letter-spacing: 1px;
  margin-bottom: 13px;
}

.progress {
  width: 100%;
  height: 4px;
  border-radius: 10px;
  overflow: hidden;
  background: rgba(255,255,255,.15);
}

.progress-bar {
  width: 35%;
  height: 100%;
  border-radius: 10px;
  background: linear-gradient(90deg, #19c6bd, #b1fff0);
  box-shadow: 0 0 12px #19c6bd;
  animation: progress 2s ease-in-out infinite;
}

/* Muncul bila formulir lama terbuka / tidak ada internet */
#lambat {
  display: none;
  margin-top: 16px;
  font-size: 12px;
  line-height: 1.6;
  color: #d2f5f0;
}

#lambat a {
  display: inline-block;
  margin-top: 10px;
  padding: 10px 20px;
  border-radius: 12px;
  background: #fff;
  color: #075765;
  font-weight: 700;
  font-size: 13px;
  text-decoration: none;
}

.footer {
  margin-top: 22px;
  font-size: 9px;
  color: rgba(255,255,255,.55);
  letter-spacing: 1.5px;
}

@keyframes pulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.09); }
}

@keyframes rotate {
  to { transform: rotate(360deg); }
}

@keyframes ripple {
  0% { transform: scale(.65); opacity: .7; }
  100% { transform: scale(1.35); opacity: 0; }
}

@keyframes wave {
  0%,100% { height: 7px; }
  50% { height: 25px; }
}

@keyframes progress {
  0% { transform: translateX(-110%); }
  100% { transform: translateX(310%); }
}

@keyframes blink {
  0%,100% { opacity: 1; }
  50% { opacity: .3; }
}

@keyframes glowMove {
  from { transform: translate(-80px,-40px); }
  to { transform: translate(80px,50px); }
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(25px) scale(.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@media (max-width: 480px) {
  .card { padding: 32px 23px 27px; }
  h1 { font-size: 24px; }
  .visual { transform: scale(.92); margin-bottom: 18px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
  }
}
</style>
</head>

<body>

<div id="bingkai">
  <iframe id="app" title="Formulir pendaftaran online"
    allow="clipboard-read; clipboard-write; geolocation">
  </iframe>
</div>

<div id="loader" role="status" aria-live="polite">
  <div class="glow"></div>

  <div class="card">
    <div class="eyebrow">
      <span class="status-dot"></span>
      UPT PUSKESMAS PANJATAN I
    </div>

    <div class="visual">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="orbit"></div>
      <div class="core"><img src="icon.png" alt=""></div>
    </div>

    <h1>PENDAFTARAN</h1>

    <p class="subtitle">
      <b>PENDAFTARAN ONLINE</b><br>
      Mudah • Cepat • Praktis<br>
      Silakan lengkapi data pendaftaran Anda
    </p>

    <div class="wave">
      <span></span><span></span><span></span>
      <span></span><span></span><span></span>
      <span></span><span></span><span></span>
      <span></span><span></span>
    </div>

    <div class="loading-text" id="teks">
      Menyiapkan formulir pendaftaran...
    </div>

    <div class="progress">
      <div class="progress-bar"></div>
    </div>

    <div id="lambat">
      Formulir lebih lama dari biasanya.<br>Periksa sinyal internet, atau buka langsung:<br>
      <a id="langsung" href="#" target="_top">Buka formulir</a>
    </div>

    <div class="footer">
      KULON PROGO • LAYANAN DIGITAL
    </div>
  </div>
</div>

<script>
// URL web app Pendaftaran Online (Apps Script /exec). Ganti di sini saja bila deployment baru.
const APP_URL = "https://script.google.com/macros/s/AKfycbzokP_1GT--phvaZz1aEGkd_hKBnUrX3xpQqxMGoqjb_xyhm1-o616R7osdqouvSfHqSA/exec";

const app = document.getElementById("app");
const loader = document.getElementById("loader");
const lambat = document.getElementById("lambat");

// Parameter alamat ikut diteruskan (mis. ?p=loket membuka Panel petugas)
const url = APP_URL + (location.search || "");
document.getElementById("langsung").href = url;

// Tinggi layar nyata (HP lama tanpa dvh, iPhone saat address bar berubah)
function ukur() {
  const h = window.visualViewport ? visualViewport.height : innerHeight;
  document.documentElement.style.setProperty("--tinggi", h + "px");
}
ukur();
addEventListener("resize", ukur);
addEventListener("orientationchange", () => setTimeout(ukur, 300));
if (window.visualViewport) visualViewport.addEventListener("resize", ukur);

let tampil = false;
function hideLoader() {
  if (tampil) return;
  tampil = true;
  loader.classList.add("hide");
}

app.addEventListener("load", function () {
  setTimeout(hideLoader, 500);
});
app.src = url;

// Formulir belum siap setelah 12 detik → tampilkan tombol buka langsung (bukan layar kosong)
setTimeout(function () {
  if (!tampil) lambat.style.display = "block";
}, 12000);

if (!navigator.onLine) {
  document.getElementById("teks").textContent = "Tidak ada koneksi internet.";
  lambat.style.display = "block";
}
addEventListener("online", function () {
  if (!tampil) location.reload();
});
</script>

</body>
</html>
