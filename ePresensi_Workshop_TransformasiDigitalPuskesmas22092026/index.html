<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>e-Presensi & RTL</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #0f3d32;
    }

    /* =========================
       LOADER
    ========================= */

    #loader {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at 50% 40%,
          #1b5e4b 0%,
          #124738 40%,
          #0b3028 100%
        );

      opacity: 1;
      visibility: visible;

      transition:
        opacity .65s ease,
        visibility .65s ease;
    }

    #loader.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-box {
      width: min(88%, 390px);
      text-align: center;
      color: white;
    }

    /* ICON */

    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 22px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid rgba(255,255,255,.22);
      border-radius: 20px;

      background: rgba(255,255,255,.08);

      box-shadow:
        0 15px 40px rgba(0,0,0,.18);

      animation: iconFloat 2.2s ease-in-out infinite;
    }

    .icon svg {
      width: 36px;
      height: 36px;
      stroke: white;
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @keyframes iconFloat {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }
    }

    /* TEXT */

    .small-title {
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,.72);
      margin-bottom: 9px;
    }

    .main-title {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -.4px;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      line-height: 1.6;
      color: rgba(255,255,255,.72);
      margin-bottom: 28px;
    }

    /* PROGRESS */

    .progress-area {
      width: 100%;
      max-width: 270px;
      margin: 0 auto;
    }

    .progress-track {
      width: 100%;
      height: 3px;
      overflow: hidden;

      border-radius: 10px;
      background: rgba(255,255,255,.16);
    }

    .progress-bar {
      width: 0%;
      height: 100%;

      border-radius: 10px;
      background: rgba(255,255,255,.9);

      transition: width .25s ease;
    }

    .loading-text {
      margin-top: 12px;

      font-size: 12px;
      letter-spacing: .5px;

      color: rgba(255,255,255,.65);
    }


    /* =========================
       APP
    ========================= */

    #app {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      border: none;
      background: white;

      opacity: 0;
      transition: opacity .6s ease;
    }

    #app.show {
      opacity: 1;
    }
  </style>
</head>

<body>

  <!-- LOADER -->
  <div id="loader">

    <div class="loader-box">

      <div class="icon">

        <!-- Clipboard / Attendance Icon -->
        <svg viewBox="0 0 24 24">

          <rect
            x="5"
            y="4"
            width="14"
            height="17"
            rx="2"
          />

          <path d="M9 4.5V3.5C9 2.7 9.7 2 10.5 2h3c.8 0 1.5.7 1.5 1.5v1"/>

          <path d="M8.5 10h7"/>
          <path d="M8.5 14h7"/>
          <path d="M8.5 18h4"/>

        </svg>

      </div>

      <div class="small-title">
        Workshop Transformasi Digital
      </div>

      <div class="main-title">
        e-Presensi & RTL
      </div>

      <div class="subtitle">
        Presensi dan tindak lanjut kegiatan
      </div>

      <div class="progress-area">

        <div class="progress-track">
          <div
            class="progress-bar"
            id="progressBar">
          </div>
        </div>

        <div
          class="loading-text"
          id="loadingText">
          Memuat aplikasi
        </div>

      </div>

    </div>

  </div>


  <!-- GOOGLE APPS SCRIPT -->
  <iframe
    id="app"
    src="https://script.google.com/macros/s/AKfycbxHJsbxc0lbjAT8RPxYrXqSBOD5Y-EndykGulYdLaWzhVSg0a-vHdincp43yJtIIeG5/exec"
    allow="camera; microphone; geolocation"
    loading="eager">
  </iframe>


  <script>

    const loader = document.getElementById("loader");
    const app = document.getElementById("app");
    const progressBar = document.getElementById("progressBar");

    let progress = 0;
    let finished = false;


    /* =========================
       PROGRESS ANIMATION
    ========================= */

    const progressTimer = setInterval(() => {

      if (finished) {
        clearInterval(progressTimer);
        return;
      }

      if (progress < 88) {

        progress += Math.random() * 5;

        if (progress > 88) {
          progress = 88;
        }

        progressBar.style.width = progress + "%";
      }

    }, 180);


    /* =========================
       APP READY
    ========================= */

    app.addEventListener("load", () => {

      if (finished) return;

      finished = true;

      clearInterval(progressTimer);

      progressBar.style.width = "100%";

      setTimeout(() => {

        app.classList.add("show");

        setTimeout(() => {
          loader.classList.add("hide");
        }, 250);

      }, 500);

    });


    /* =========================
       FALLBACK
       Jika iframe terlalu lama
    ========================= */

    setTimeout(() => {

      if (finished) return;

      finished = true;

      clearInterval(progressTimer);

      progressBar.style.width = "100%";

      setTimeout(() => {

        app.classList.add("show");
        loader.classList.add("hide");

      }, 500);

    }, 8000);

  </script>

</body>
</html>
