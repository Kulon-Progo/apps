
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPM PTM Dinkes Kulon Progo</title>

<style>
:root {
  --primary: #c12b55;
  --secondary: #f05b72;
  --accent: #ffc078;
  --dark: #3b1028;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: "Segoe UI", Arial, sans-serif;
  background: #fff7f8;
}

#app {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}

#loader {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background:
    radial-gradient(circle at 18% 20%, rgba(255,145,145,.25), transparent 35%),
    radial-gradient(circle at 85% 80%, rgba(240,91,114,.3), transparent 35%),
    linear-gradient(135deg, #260b20, #6e183d 55%, #3b1028);
  transition: opacity .7s ease, visibility .7s ease;
}

#loader.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.glow {
  position: absolute;
  width: 340px;
  height: 340px;
  border-radius: 50%;
  background: var(--secondary);
  filter: blur(110px);
  opacity: .2;
  animation: glowMove 6s ease-in-out infinite alternate;
}

.card {
  position: relative;
  width: min(90%, 390px);
  padding: 38px 28px 32px;
  border: 1px solid rgba(255,255,255,.17);
  border-radius: 28px;
  background: rgba(255,255,255,.09);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: 0 25px 70px rgba(0,0,0,.3);
  text-align: center;
  color: white;
  animation: cardIn .9s ease both;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 8px 14px;
  border-radius: 30px;
  background: rgba(255,255,255,.1);
  color: #ffd5dc;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  margin-bottom: 23px;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #ffb86b;
  box-shadow: 0 0 12px #ffb86b;
  animation: blink 1.2s infinite;
}

.visual {
  position: relative;
  width: 150px;
  height: 150px;
  margin: 0 auto 25px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.core {
  width: 94px;
  height: 94px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  font-size: 42px;
  background: linear-gradient(145deg, #ff8b9b, #c12b55);
  box-shadow: 0 0 35px rgba(240,91,114,.45),
              inset 0 2px 10px rgba(255,255,255,.35);
  animation: pulse 2s ease-in-out infinite;
  z-index: 2;
}

.orbit {
  position: absolute;
  inset: 5px;
  border: 1px solid rgba(255,192,120,.4);
  border-radius: 50%;
  animation: rotate 8s linear infinite;
}

.orbit::before,
.orbit::after {
  content: "";
  position: absolute;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #ffc078;
  box-shadow: 0 0 15px #ffc078;
}

.orbit::before {
  top: 17px;
  left: 20px;
}

.orbit::after {
  bottom: 15px;
  right: 17px;
  width: 7px;
  height: 7px;
}

.ring {
  position: absolute;
  inset: 0;
  border: 1px solid rgba(255,192,120,.2);
  border-radius: 50%;
  animation: ripple 3s ease-out infinite;
}

.ring:nth-child(2) { animation-delay: 1s; }
.ring:nth-child(3) { animation-delay: 2s; }

h1 {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: 2px;
  margin-bottom: 9px;
}

.subtitle {
  color: #f8cbd6;
  font-size: 12px;
  line-height: 1.7;
  letter-spacing: .5px;
}

.wave {
  height: 28px;
  margin: 24px auto 19px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 5px;
}

.wave span {
  width: 4px;
  height: 9px;
  border-radius: 5px;
  background: #ff9cae;
  animation: wave 1s ease-in-out infinite;
}

.wave span:nth-child(2n) { animation-delay: .15s; }
.wave span:nth-child(3n) { animation-delay: .3s; }
.wave span:nth-child(4n) { animation-delay: .45s; }

.loading-text {
  font-size: 11px;
  color: #ffe1e6;
  letter-spacing: 1px;
  margin-bottom: 13px;
}

.progress {
  width: 100%;
  height: 4px;
  border-radius: 10px;
  overflow: hidden;
  background: rgba(255,255,255,.15);
}

.progress-bar {
  width: 35%;
  height: 100%;
  border-radius: 10px;
  background: linear-gradient(90deg, #f05b72, #ffc078);
  box-shadow: 0 0 12px #f05b72;
  animation: progress 2s ease-in-out infinite;
}

.footer {
  margin-top: 22px;
  font-size: 9px;
  color: rgba(255,255,255,.55);
  letter-spacing: 1.5px;
}

@keyframes pulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.09); }
}

@keyframes rotate {
  to { transform: rotate(360deg); }
}

@keyframes ripple {
  0% { transform: scale(.65); opacity: .7; }
  100% { transform: scale(1.35); opacity: 0; }
}

@keyframes wave {
  0%,100% { height: 7px; }
  50% { height: 25px; }
}

@keyframes progress {
  0% { transform: translateX(-110%); }
  100% { transform: translateX(310%); }
}

@keyframes blink {
  0%,100% { opacity: 1; }
  50% { opacity: .3; }
}

@keyframes glowMove {
  from { transform: translate(-80px,-40px); }
  to { transform: translate(80px,50px); }
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(25px) scale(.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@media (max-width: 480px) {
  .card { padding: 32px 23px 27px; }
  h1 { font-size: 25px; }
  .visual { transform: scale(.92); margin-bottom: 18px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
  }
}
</style>
</head>

<body>

<iframe id="app"
  src="https://script.google.com/macros/s/AKfycbzwOxZ32a7wWQizt3R74yG1NJiMZv7HdanEGWNlg8ZywzLU12cJ08xyMmybkkKD_n0UiA/exec"
  allow="clipboard-read; clipboard-write; geolocation">
</iframe>

<div id="loader">
  <div class="glow"></div>

  <div class="card">
    <div class="eyebrow">
      <span class="status-dot"></span>
      PUBLIC HEALTH SERVICE
    </div>

    <div class="visual">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="orbit"></div>
      <div class="core">❤️</div>
    </div>

    <h1>SPM PTM</h1>

    <p class="subtitle">
      Sistem Pelayanan Minimal<br>
      Pencegahan dan Pengendalian Penyakit Tidak Menular<br>
      Dinas Kesehatan Kulon Progo
    </p>

    <div class="wave">
      <span></span><span></span><span></span>
      <span></span><span></span><span></span>
      <span></span><span></span><span></span>
      <span></span><span></span>
    </div>

    <div class="loading-text">
      Mempersiapkan sistem...
    </div>

    <div class="progress">
      <div class="progress-bar"></div>
    </div>

    <div class="footer">
      DINAS KESEHATAN KULON PROGO
    </div>
  </div>
</div>

<script>
const app = document.getElementById("app");
const loader = document.getElementById("loader");

function hideLoader() {
  loader.classList.add("hide");
}

app.addEventListener("load", function() {
  setTimeout(hideLoader, 500);
});

// Pengaman jika iframe membutuhkan waktu lama
setTimeout(hideLoader, 10000);
</script>

</body>
</html>
